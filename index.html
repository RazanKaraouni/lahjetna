<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="لهجتنا - منصة لاستكشاف اللهجات اللبنانية عبر خريطة تفاعلية">
    <title>لهجتنا - اكتشف لهجات لبنان</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top custom-navbar shadow-sm">
        <div class="container position-relative">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-white" href="home.html">
                <img src="assets/logo.jpeg" alt="لهجتنا Logo" class="d-inline-block align-text-top rounded-circle border border-white">
                <span>لهجتنا</span>
            </a>
            <span class="navbar-page-title">اكتشف لهجات لبنان</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fs-5 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">الصفحة الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">تعرّف علينا</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="map.html">الخريطة</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container home-main">
        <section class="text-center home-video-section">
            <div class="phone-frame" aria-label="هاتف يعرض فيديو التعريف">
                <span class="phone-frame__btn phone-frame__btn--silent" aria-hidden="true"></span>
                <span class="phone-frame__btn phone-frame__btn--vol-up" aria-hidden="true"></span>
                <span class="phone-frame__btn phone-frame__btn--vol-down" aria-hidden="true"></span>
                <span class="phone-frame__btn phone-frame__btn--power" aria-hidden="true"></span>
                <div class="phone-frame__bezel">
                    <div class="phone-frame__screen">
                        <span class="phone-frame__island" aria-hidden="true"></span>
                        <video id="introVideo" controls playsinline>
                            <source src="assets/introduction.mp4" type="video/mp4">
                            المتصفح لا يدعم عرض الفيديو.
                        </video>
                        <span class="phone-frame__home" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </section>

        <hr class="home-divider">

    </main>

    <footer class="site-footer">
        <p class="mb-0">© لهجتنا — حفظ التنوّع اللغوي اللبناني</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script>
        (function () {
            var video = document.getElementById("introVideo");
            if (!video) return;

            function fitFrameToVideo() {
                if (!video.videoWidth || !video.videoHeight) return;
                video.style.aspectRatio = video.videoWidth + " / " + video.videoHeight;
            }

            video.addEventListener("loadedmetadata", fitFrameToVideo);
            if (video.readyState >= 1) fitFrameToVideo();
        })();
    </script>
</body>
</html>
